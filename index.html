<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indy Public Library Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        #chatbox {
            width: 50%;
            margin: auto;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
            text-align: left;
        }
        .message {
            margin: 10px 0;
        }
        .user {
            color: blue;
        }
        .bot {
            color: green;
        }
    </style>
</head>
<body>
    <h1>Indy Public Library Chatbot</h1>
    <div id="chatbox"></div>
    <form id="chatForm">
        <input type="text" id="user_input" name="user_input" placeholder="Type your message..." required>
        <button type="submit">Send</button>
    </form>

    <script>
        document.getElementById("chatForm").addEventListener("submit", function(event) {
            event.preventDefault();
            let userInput = document.getElementById("user_input").value;
            if (userInput.trim() === "") return;
    
            let chatbox = document.getElementById("chatbox");
            chatbox.innerHTML += `<div class="message user"><strong>You:</strong> ${userInput}</div>`;
    
            fetch("/get_response", {
                method: "POST",
                body: new URLSearchParams({ user_input: userInput }),
                headers: { "Content-Type": "application/x-www-form-urlencoded" }
            })
            .then(response => response.json())
            .then(data => {
                let botResponse = data.response;
                
                // Convert URLs into clickable links
                botResponse = botResponse.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
    
                chatbox.innerHTML += `<div class="message bot"><strong>Bot:</strong> ${botResponse}</div>`;
                document.getElementById("user_input").value = "";
            });
        });
    </script>
    
</body>
</html>
